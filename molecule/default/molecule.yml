---
dependency:
  name: galaxy
driver:
  name: docker
lint: |
  set -e
  yamllint .
  ansible-lint
platforms:
  - name: instance
    image: "geerlingguy/docker-ubuntu2004-ansible:latest"
    privileged: true
provisioner:
  name: ansible
  playbooks:
    converge: playbooks/manage_environment.yml
verifier:
  name: ansible
