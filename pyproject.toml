[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-environment-manager"
version = "0.1.0"
description = "Manage isolated AWS environments"
authors = [{ name = "Joey Huckabee", email = "22042209+interwebshack@users.noreply.github.com" }]
requires-python = ">=3.10"

# Main (production) dependencies
dependencies = [
    "awscli>=1.35.15",
    "ansible>=10.7.0", # Ansible 11.x requires Python 3.11+  
    "boto3==1.35.49",
    "botocore==1.35.49",
]

# Optional dependency groups
[project.optional-dependencies]
dev = [
    "ansible-lint>=25.6.1",
    "yamllint>=1.37.1",
    "molecule[docker]>=25.6.0",
    "detect-secrets>=1.5.0",
    "checkov>=3.2.451",
]

[tool.setuptools]
packages = []
